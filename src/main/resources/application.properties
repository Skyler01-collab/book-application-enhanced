spring.application.name=book-application
spring.server.port=8081
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=book-system
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Fresh schema on every start (the H2 database lives in memory)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Load mock books on startup so you can try pagination straight away. Set to false to start empty.
app.seed-data=true
